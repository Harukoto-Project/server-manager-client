appId: com.harukoto-project.server-manager
productName: Server Manager
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
