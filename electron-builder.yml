appId: com.harukoto-project.server-manager
productName: Server Manager
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: Harukoto-Project
  repo: server-manager-client
