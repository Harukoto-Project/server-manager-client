<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<!--
			CSPはここではなくメインプロセス側(src/main/index.ts)で、
			開発時(Vite Dev Server + React Refresh)と本番ビルドで別々の内容をレスポンスヘッダーとして付与する。
			ここに固定のCSP metaタグを置くと、開発時にReact Refreshのインラインスクリプトがブロックされ、
			画面が真っ黒になる(root要素へのレンダリングが失敗する)ため置かない。
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Server Manager</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
